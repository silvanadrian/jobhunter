name: Typst installieren
description: Lädt eine fest gepinnte Typst-Version herunter und prüft die Prüfsumme.
inputs:
  version:
    description: Typst-Version
    default: "0.13.1"
  sha256:
    description: SHA-256 von typst-x86_64-unknown-linux-musl.tar.xz dieser Version
    default: "7d214bfeffc2e585dc422d1a09d2b144969421281e8c7f5d784b65fc69b5673f"
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail
        url="https://github.com/typst/typst/releases/download/v${{ inputs.version }}/typst-x86_64-unknown-linux-musl.tar.xz"
        curl -fsSL -o "$RUNNER_TEMP/typst.tar.xz" "$url"
        echo "${{ inputs.sha256 }}  $RUNNER_TEMP/typst.tar.xz" | sha256sum -c -
        tar -xf "$RUNNER_TEMP/typst.tar.xz" -C "$RUNNER_TEMP"
        echo "$RUNNER_TEMP/typst-x86_64-unknown-linux-musl" >> "$GITHUB_PATH"
        "$RUNNER_TEMP/typst-x86_64-unknown-linux-musl/typst" --version
